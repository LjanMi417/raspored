<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Raspored gledanja</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#101119;--panel:#1A1C27;--panel-2:#212433;--line:#2E3243;--line-soft:#232634;
  --paper:#E9E7E0;--muted:#868CA3;--muted-2:#5D6379;
  --amber:#E8A33D;--teal:#57BFA2;--rose:#D96A8A;
  --sans:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"Roboto Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--ink);color:var(--paper);font-family:var(--sans);font-size:15px;
  line-height:1.45;padding-bottom:40px;overscroll-behavior-y:none}
.wrap{max-width:760px;margin:0 auto}
header{position:sticky;top:0;z-index:40;background:linear-gradient(180deg,#171925,#14161F);
  border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 14px 0}
header::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background:repeating-linear-gradient(180deg,rgba(255,255,255,.022) 0 1px,transparent 1px 3px)}
.hrow{display:flex;align-items:baseline;gap:10px;position:relative}
.brand{font-weight:900;font-size:15px;letter-spacing:.16em;text-transform:uppercase;margin:0}
.brand span{color:var(--amber)}
.count{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.06em}
.bar{position:relative;height:3px;background:var(--line-soft);border-radius:2px;margin:9px 0 0;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--teal);transition:width .35s cubic-bezier(.4,0,.2,1)}
.tabs{display:flex;gap:2px;position:relative;margin-top:9px}
.tab{appearance:none;border:0;background:transparent;color:var(--muted);font-family:var(--sans);
  font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase;padding:9px 13px;
  cursor:pointer;border-bottom:2px solid transparent}
.tab[aria-selected="true"]{color:var(--paper);border-bottom-color:var(--amber)}
main{padding:0 14px}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--muted-2);margin:20px 0 8px;display:flex;align-items:center;gap:9px}
.eyebrow::after{content:"";flex:1;height:1px;background:var(--line-soft)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:8px}
.card.hero{border-color:rgba(232,163,61,.4);background:var(--panel-2)}
.card.done{opacity:.45}
.chead{display:flex;align-items:center;gap:10px;width:100%;padding:12px 13px;background:transparent;
  border:0;cursor:pointer;text-align:left;color:inherit;font-family:inherit}
.gno{font-family:var(--mono);font-weight:700;font-size:12px;letter-spacing:.1em;flex-shrink:0}
.card.hero .gno{color:var(--amber)}
.gmeta{margin-left:auto;display:flex;align-items:center;gap:11px;flex-shrink:0}
.frac{font-family:var(--mono);font-size:12px;color:var(--muted)}
.frac.full{color:var(--teal)}
.sum{font-family:var(--mono);font-size:11px;color:var(--muted-2)}
.chev{width:9px;height:9px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);
  transform:rotate(45deg) translate(-2px,-2px);transition:transform .2s;flex-shrink:0}
.card.open .chev{transform:rotate(-135deg) translate(-2px,-2px)}
.cbody{border-top:1px solid var(--line-soft);padding:3px 0 7px}
.t{display:flex;align-items:flex-start;gap:2px;font-size:14px;line-height:1.35}
.t:hover{background:rgba(255,255,255,.02)}
.tick{background:transparent;border:0;padding:9px 4px 9px 13px;cursor:pointer;flex-shrink:0}
.box{width:17px;height:17px;border:1.5px solid var(--muted-2);border-radius:4px;position:relative;
  transition:.15s;margin-top:2px}
.t.on .box{background:var(--teal);border-color:var(--teal)}
.t.on .box::after{content:"";position:absolute;left:5px;top:1.5px;width:4px;height:8px;
  border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(42deg)}
.go{flex:1;min-width:0;display:flex;align-items:flex-start;gap:9px;padding:9px 13px 9px 7px;
  background:transparent;border:0;text-align:left;color:inherit;font:inherit;cursor:pointer;
  text-decoration:none}
.go:active{background:rgba(255,255,255,.05)}
.tname{flex:1;min-width:0}
.t.on .tname{color:var(--muted-2);text-decoration:line-through;text-decoration-thickness:1px}
.link .tname{border-bottom:1px solid var(--line);display:inline}
.arw{font-family:var(--mono);font-size:11px;color:var(--muted-2);margin-left:5px}
.ready .arw{color:var(--amber)}
.ep{font-family:var(--mono);font-size:11px;color:var(--muted-2);margin-left:7px;white-space:nowrap}
.score{font-family:var(--mono);font-size:12px;color:var(--muted);flex-shrink:0;margin-top:1px}
.flag{display:inline-block;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--rose);border:1px solid rgba(217,106,138,.45);
  border-radius:3px;padding:1px 5px;margin-left:7px;vertical-align:1px}
.t.unk .box{border-style:dashed}
.t.unk .tname{font-style:italic;color:var(--muted)}
.act{display:block;margin:5px 13px 3px;padding:9px;width:calc(100% - 26px);background:transparent;
  border:1px dashed var(--line);border-radius:7px;color:var(--muted);font-family:var(--mono);
  font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
.act:active{background:rgba(255,255,255,.04);color:var(--paper)}
.toolbar{display:flex;gap:7px;margin:14px 0 2px;flex-wrap:wrap;align-items:center}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:20px;color:var(--muted);
  font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  padding:7px 13px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--amber);color:var(--amber)}
.chip.go-link{border-color:rgba(232,163,61,.5);color:var(--amber)}
.chip:disabled{opacity:.5;cursor:default}
.sync{font-family:var(--mono);font-size:10.5px;color:var(--muted-2);letter-spacing:.06em}
.trow{border-bottom:1px solid var(--line-soft)}
.tprog{display:flex;align-items:center;gap:8px;margin-top:5px}
.mini{flex:1;height:2px;background:var(--line-soft);border-radius:2px;overflow:hidden;max-width:120px}
.mini i{display:block;height:100%;background:var(--teal)}
.mal{display:block;font-family:var(--mono);font-size:10.5px;color:var(--muted-2);margin-top:4px}
.mal b{color:var(--teal);font-weight:400}
.eps{display:flex;flex-wrap:wrap;gap:5px;padding:2px 13px 12px 42px}
.epc{font-family:var(--mono);font-size:11px;padding:5px 8px;border-radius:5px;cursor:pointer;
  background:transparent;border:1px solid var(--line);color:var(--muted)}
.epc.on{background:rgba(87,191,162,.14);border-color:var(--teal);color:var(--teal)}
.fix{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  background:transparent;border:1px solid var(--line);border-radius:4px;color:var(--muted-2);
  padding:3px 7px;cursor:pointer;margin:0 13px 12px 42px}
.note{font-size:12.5px;color:var(--muted);line-height:1.6;border-left:2px solid var(--line);
  padding-left:11px;margin:20px 0 22px}
.note b{color:var(--paper);font-weight:700}
.note code{font-family:var(--mono);font-size:11.5px;color:var(--amber)}
.empty{color:var(--muted-2);font-size:13px;padding:26px 2px;text-align:center}
.hidden{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:4px}
</style>
</head>

const dec=s=>(s/100).toFixed(2);
const SKEY="raspored:v2", MKEY="raspored:mal", TKEY="raspored:ts";
let done=new Set(), memD=null, memM=null, openSet=new Set(), openT=new Set(), mal={};
let hideDone=false, openAll=false, sortBy="score", syncing=false;

const hasWS=typeof window.storage!=="undefined"&&window.storage&&typeof window.storage.get==="function";
let hasLS=false;try{localStorage.setItem("__t","1");localStorage.removeItem("__t");hasLS=true}catch(e){}
async function sGet(k,f){
  if(hasWS){try{const r=await window.storage.get(k);if(r)return JSON.parse(r.value)}catch(e){}}
  if(hasLS){try{const v=localStorage.getItem(k);if(v!==null)return JSON.parse(v)}catch(e){}}
  const m=(k===SKEY?memD:memM);return m!=null?m:f;
}
async function sSet(k,v){
  if(k===SKEY)memD=v;else memM=v;
  if(hasWS){try{await window.storage.set(k,JSON.stringify(v))}catch(e){}}
  if(hasLS){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
}
function stamp(){lastTs=Date.now();try{localStorage.setItem(TKEY,String(lastTs))}catch(e){}}
const persist=()=>{stamp();sSet(SKEY,[...done]);schedulePush()};
const persistMal=()=>{stamp();sSet(MKEY,mal);schedulePush()};
const id=(g,i)=>g+"."+i;
const gDone=g=>g[2].filter((_,i)=>done.has(id(g[0],i))).length;

const titleIndex=(()=>{
  const m=new Map();
  G.forEach(g=>g[2].forEach((r,i)=>{
    const k=r[1]||("??"+r[0]);
    if(!m.has(k))m.set(k,{key:k,name:r[1],score:r[0],unk:!r[1],slots:[]});
    m.get(k).slots.push([g[0],i,r[2]]);
  }));
  return [...m.values()];
})();
const resolvable=titleIndex.filter(t=>!t.unk);

/* ---- Jikan ---- */
const norm=s=>(s||"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
function sim(a,b){
  const A=new Set(norm(a).split(" ")), B=norm(b).split(" ");
  if(!B.length)return 0;
  return B.filter(w=>A.has(w)).length/Math.max(A.size,B.length);
}
async function lookup(name){
  const q=name.replace(/½/g,"1 2").replace(/\s*\(\d{4}\)\s*/," ").replace(/["]/g,"");
  const r=await fetch("https://api.jikan.moe/v4/anime?limit=6&q="+encodeURIComponent(q));
  if(!r.ok)throw new Error(r.status);
  const j=await r.json();
  if(!j.data||!j.data.length)return null;
  let best=null,bs=-1;
  for(const a of j.data){
    const cands=[a.title,a.title_english,a.title_japanese,...(a.titles||[]).map(t=>t.title),...(a.title_synonyms||[])];
    const s=Math.max(...cands.filter(Boolean).map(c=>sim(name,c)));
    if(s>bs){bs=s;best=a}
  }
  return best?{id:best.mal_id,t:best.title}:null;
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function syncAll(){
  if(syncing)return; syncing=true;
  const btn=document.getElementById("sync"), msg=document.getElementById("syncmsg");
  btn.disabled=true;
  const todo=resolvable.filter(t=>!mal[t.key]);
  if(!todo.length){msg.textContent="Sve je već povezano.";btn.disabled=false;syncing=false;return}
  let ok=0,fail=0,gap=450,lastErr="",streak=0;
  for(let i=0;i<todo.length;i++){
    msg.textContent=`${i+1}/${todo.length} …`;
    let got=false;
    for(let a=0;a<3&&!got;a++){
      try{
        const r=await lookup(todo[i].name);
        if(r){mal[todo[i].key]=r;ok++}else fail++;
        got=true;streak=0;
        if(gap>450)gap-=100;               // oporavak kad prodje glatko
      }catch(e){
        lastErr=String(e.message);streak++;
        if(lastErr.includes("429")||lastErr.includes("500")){
          gap=Math.min(gap+600,3000);      // uspori i probaj opet
          await sleep(2000*(a+1));
        }else{fail++;got=true}             // druga greska: preskoci naslov
      }
    }
    if(!got)fail++;
    if(streak>=5){                          // sve pada - nema svrhe dalje
      msg.textContent=`Prekinuto na ${i+1}/${todo.length}. Greška: ${lastErr||"mreža"}. Sačekaj par minuta pa pritisni ponovo — nastaviće odavde.`;
      persistMal();render();btn.disabled=false;syncing=false;return;
    }
    await sleep(gap);
    if(i%8===0){persistMal();render()}
  }
  persistMal();render();
  msg.textContent = fail
    ? `Povezano ${ok}, neuspešno ${fail}${lastErr?` (${lastErr})`:""}. Pritisni ponovo da probaš ostatak.`
    : `Povezano ${ok}. Gotovo.`;
  btn.disabled=false;syncing=false;
}
/* ---- GitHub Gist sinhronizacija ---- */
const GFILE="raspored-progress.json", GHKEY="raspored:gh";
let gh=null, lastTs=0, pushT=null, pulling=false;
function ghLoad(){try{const v=localStorage.getItem(GHKEY);return v?JSON.parse(v):null}catch(e){return null}}
function ghSave(v){try{v?localStorage.setItem(GHKEY,JSON.stringify(v)):localStorage.removeItem(GHKEY)}catch(e){}}
function ghStatus(t){document.getElementById("ghmsg").textContent=t}
async function api(path,opts={}){
  const r=await fetch("https://api.github.com"+path,{...opts,
    headers:{Authorization:"Bearer "+gh.token,Accept:"application/vnd.github+json",...(opts.headers||{})}});
  if(!r.ok)throw new Error("HTTP "+r.status);
  return r.json();
}
const payload=()=>JSON.stringify({ts:lastTs,done:[...done],mal});
async function ghFindOrCreate(){
  const list=await api("/gists?per_page=100");
  const f=list.find(g=>g.files&&g.files[GFILE]);
  if(f)return f.id;
  const c=await api("/gists",{method:"POST",body:JSON.stringify({
    description:"Raspored — napredak gledanja",public:false,
    files:{[GFILE]:{content:payload()}}})});
  return c.id;
}
async function ghPull(){
  const g=await api("/gists/"+gh.gistId), f=g.files&&g.files[GFILE];
  if(!f)return null;
  let c=f.content;
  if(f.truncated&&f.raw_url)c=await(await fetch(f.raw_url)).text();
  return JSON.parse(c);
}
async function ghPush(){
  if(!gh)return;
  ghStatus("šaljem…");
  try{await api("/gists/"+gh.gistId,{method:"PATCH",body:JSON.stringify({files:{[GFILE]:{content:payload()}}})});
    ghStatus("sinhronizovano "+new Date().toLocaleTimeString("sr-RS",{hour:"2-digit",minute:"2-digit"}));
  }catch(e){ghStatus("greška pri slanju")}
}
function schedulePush(){if(!gh)return;clearTimeout(pushT);pushT=setTimeout(ghPush,1500)}
const hhmm=t=>new Date(t).toLocaleTimeString("sr-RS",{hour:"2-digit",minute:"2-digit"});
async function ghSync(){
  if(!gh||pulling)return;
  pulling=true;ghStatus("proveravam…");
  try{
    const r=await ghPull();
    if(!r){await ghPush();pulling=false;return}
    const rts=r.ts||0, rmal=r.mal||{}, before=JSON.stringify(mal);
    // MAL veze se uvek spajaju - nijedna strana ih ne brise
    mal = rts>lastTs ? {...mal,...rmal} : {...rmal,...mal};
    if(rts>lastTs){
      done=new Set(r.done||[]); lastTs=rts;
      try{localStorage.setItem(TKEY,String(lastTs))}catch(e){}
      await sSet(SKEY,[...done]);
      ghStatus("preuzeto "+hhmm(lastTs));
    }else ghStatus("sinhronizovano "+hhmm(lastTs||Date.now()));
    if(JSON.stringify(mal)!==before){await sSet(MKEY,mal)}
    render();
    // lokalno novije ili ima veza kojih nema gore -> posalji
    if(rts<lastTs||Object.keys(mal).length>Object.keys(rmal).length)await ghPush();
  }catch(e){ghStatus("greška: "+e.message)}
  pulling=false;
}
async function ghConnect(){
  const t=prompt("Nalepi GitHub token (klasičan, samo 'gist' ovlašćenje):");
  if(!t)return;
  gh={token:t.trim(),gistId:null};
  ghStatus("povezujem…");
  try{
    gh.gistId=await ghFindOrCreate();
    const r=await ghPull();
    if(r&&done.size&&(r.done||[]).length){
      const spoji=confirm("Na GitHubu već postoji napredak.\n\nOK = spoji sa ovim što je na ovom uređaju\nOtkaži = uzmi verziju sa GitHuba");
      if(spoji){(r.done||[]).forEach(x=>done.add(x));mal={...(r.mal||{}),...mal};stamp();
        await sSet(SKEY,[...done]);await sSet(MKEY,mal);render();await ghPush()}
      else{lastTs=0;await ghSync()}
    }else if(r&&(r.done||[]).length){lastTs=0;await ghSync()}
    else await ghPush();
    ghSave(gh);
    document.getElementById("gh").textContent="Sinhronizuj sad";
    document.getElementById("ghoff").classList.remove("hidden");
  }catch(e){ghStatus("neuspešno: "+e.message);gh=null}
}
document.addEventListener("visibilitychange",()=>{if(!document.hidden)ghSync()});

const malUrl=k=>mal[k]?`https://myanimelist.net/anime/${mal[k].id}`:null;
async function openTitle(k,name){
  const u=malUrl(k);
  if(u)return window.open(u,"_blank","noopener");
  const w=window.open("about:blank","_blank");
  try{const r=await lookup(name);
    if(r){mal[k]=r;persistMal();render();if(w)w.location=`https://myanimelist.net/anime/${r.id}`;else window.open(`https://myanimelist.net/anime/${r.id}`,"_blank")}
    else if(w)w.location="https://myanimelist.net/search/all?q="+encodeURIComponent(name);
  }catch(e){if(w)w.location="https://myanimelist.net/search/all?q="+encodeURIComponent(name)}
}

function rowHTML(g,r,i){
  const on=done.has(id(g[0],i)), unk=!r[1], k=r[1]||("??"+r[0]), u=unk?null:malUrl(k);

    <span class="score">${dec(r[0])}</span>`;
  return `<div class="t ${on?"on":""} ${unk?"unk":""} ${u?"ready":""}">
    <button class="tick" data-slot="${id(g[0],i)}" aria-label="Odgledano"><span class="box"></span></button>
    ${unk?`<span class="go">${inner}</span>`
      :u?`<a class="go link" href="${u}" target="_blank" rel="noopener">${inner}</a>`
        :`<button class="go link" data-open="${encodeURIComponent(k)}">${inner}</button>`}
  </div>`;
}
function cardHTML(g,hero){

    ${open?`<div class="cbody">${g[2].map((r,i)=>rowHTML(g,r,i)).join("")}
      <button class="act" data-all="${g[0]}">${d===6?"Poništi grupu":"Označi celu grupu"}</button></div>`:""}

}

      <div class="t ${w===n?"on":""} ${t.unk?"unk":""} ${u?"ready":""}">
        <button class="tick" data-title="${encodeURIComponent(t.key)}" aria-label="Prikaži epizode">
          <span class="box" style="${w>0&&w<n?"background:var(--amber);border-color:var(--amber)":""}"></span></button>
        ${t.unk?`<span class="go">${inner}</span>`
          :u?`<a class="go link" href="${u}" target="_blank" rel="noopener">${inner}</a>`
            :`<button class="go link" data-open="${encodeURIComponent(t.key)}">${inner}</button>`}
      </div>
      ${op?`<div class="eps">${t.slots.map(s=>`<button class="epc ${done.has(id(s[0],s[1]))?"on":""}" data-slot="${id(s[0],s[1])}">G${s[0]} · ${s[2]}</button>`).join("")}</div>
        ${t.unk?"":`<button class="fix" data-fix="${encodeURIComponent(t.key)}">Ispravi MAL link</button>`}`:""}
    </div>`;
  }).join("");
}
document.addEventListener("click",e=>{
  const o=e.target.closest("[data-open]");
  if(o){e.preventDefault();const k=decodeURIComponent(o.dataset.open);
    const t=titleIndex.find(x=>x.key===k);return openTitle(k,t.name)}
  const f=e.target.closest("[data-fix]");
  if(f){const k=decodeURIComponent(f.dataset.fix);
    const v=prompt("Nalepi MAL link ili unesi ID:",mal[k]?`https://myanimelist.net/anime/${mal[k].id}`:"");
    if(v){const m=v.match(/(\d{2,7})/);if(m){mal[k]={id:m[1],t:"ručno ("+m[1]+")"};persistMal();render()}}
    return}
  const h=e.target.closest("[data-toggle]");
  if(h){const i=+h.dataset.toggle;openSet.has(i)?openSet.delete(i):openSet.add(i);return render()}
  const a=e.target.closest("[data-all]");
  if(a){const g=G.find(x=>x[0]===+a.dataset.all),full=gDone(g)===6;
    g[2].forEach((_,i)=>full?done.delete(id(g[0],i)):done.add(id(g[0],i)));return persist(),render()}
  const s=e.target.closest("[data-slot]");
  if(s){const k=s.dataset.slot;done.has(k)?done.delete(k):done.add(k);return persist(),render()}
  const t=e.target.closest("[data-title]");
  if(t){const k=decodeURIComponent(t.dataset.title);openT.has(k)?openT.delete(k):openT.add(k);return render()}
});
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected",x===t));
  document.getElementById("v-grupe").classList.toggle("hidden",t.dataset.view!=="grupe");
  document.getElementById("v-naslovi").classList.toggle("hidden",t.dataset.view!=="naslovi");
  scrollTo(0,0);
});
document.getElementById("sync").onclick=syncAll;
document.getElementById("gh").onclick=()=>gh?ghSync():ghConnect();
document.getElementById("ghoff").onclick=()=>{
  if(!confirm("Isključiti sinhronizaciju na ovom uređaju? Napredak ostaje, token se briše."))return;
  gh=null;ghSave(null);ghStatus("isključeno");
  document.getElementById("gh").textContent="Sinhronizacija";
  document.getElementById("ghoff").classList.add("hidden");
};
document.getElementById("exp").onclick=()=>{
  prompt("Kopiraj ovaj tekst, pa ga na drugom uređaju nalepi u Uvezi:",JSON.stringify({d:[...done],m:mal}));
};
document.getElementById("imp").onclick=()=>{
  const v=prompt("Nalepi izvezeni tekst:");if(!v)return;
  try{const o=JSON.parse(v);
    if(Array.isArray(o.d)){done=new Set(o.d);persist()}
    if(o.m&&typeof o.m==="object"){mal=o.m;persistMal()}
    render();document.getElementById("syncmsg").textContent="Uvezeno.";
  }catch(e){alert("Tekst nije ispravan.")}
};
document.getElementById("f-hide").onclick=e=>{hideDone=!hideDone;e.currentTarget.setAttribute("aria-pressed",hideDone);render()};
document.getElementById("f-open").onclick=e=>{openAll=!openAll;e.currentTarget.setAttribute("aria-pressed",openAll);
  openSet=openAll?new Set(G.map(g=>g[0])):new Set();render()};
[["s-score","score"],["s-name","name"],["s-left","left"]].forEach(([el,v])=>{
  document.getElementById(el).onclick=()=>{sortBy=v;
    ["s-score","s-name","s-left"].forEach(x=>document.getElementById(x).setAttribute("aria-pressed",x===el));render()}});
document.getElementById("reset").onclick=()=>{if(confirm("Obrisati sve oznake? MAL linkovi ostaju.")){done=new Set();persist();render()}};
